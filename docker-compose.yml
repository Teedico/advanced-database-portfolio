services:
  db:
    image: postgres:16
    container_name: unipay-pg
    environment:
      POSTGRES_USER: unipay
      POSTGRES_PASSWORD: unipay
      POSTGRES_DB: unipay
    ports:
      - "5432:5432"
    volumes:
      - unipay_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unipay -d unipay"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: unipay-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  unipay_data:
